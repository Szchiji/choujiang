<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LuckyDraw 广场 · 发现更多抽奖</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0a0a0f;
    color: #fff;
    min-height: 100vh;
  }
  .container { max-width: 1200px; margin: 0 auto; padding: 24px 16px 60px; }
  .header { text-align: center; margin-bottom: 32px; }
  .logo {
    font-size: 28px; font-weight: 800;
    background: linear-gradient(135deg, #8be9fd, #fbbf24);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }
  .slogan { color: rgba(255,255,255,0.4); font-size: 14px; }
  .search-box {
    display: flex; gap: 8px; max-width: 500px; margin: 20px auto 0;
  }
  .search-box input {
    flex: 1; padding: 12px 16px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px; color: #fff; font-size: 15px; outline: none;
  }
  .search-box input:focus { border-color: #7c3aed; }
  .search-box button {
    padding: 12px 24px; background: linear-gradient(135deg, #7c3aed, #6d28d9);
    border: none; border-radius: 12px; color: #fff;
    font-weight: 600; cursor: pointer;
  }
  .stats-bar {
    display: flex; gap: 24px; justify-content: center;
    margin: 24px 0; padding: 16px;
    background: rgba(255,255,255,0.02);
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.04);
  }
  .stat-item { text-align: center; }
  .stat-value {
    font-size: 22px; font-weight: 800;
    color: #fbbf24;
  }
  .stat-label {
    font-size: 11px; color: rgba(255,255,255,0.3);
    text-transform: uppercase; letter-spacing: 1px;
    margin-top: 4px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    margin-top: 24px;
  }
  .card {
    background: linear-gradient(145deg, #12121e, #1a1a2e);
    border-radius: 20px; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.06);
    transition: all 0.3s ease;
    cursor: pointer;
    text-decoration: none; color: inherit;
    display: block;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: rgba(124,58,237,0.4);
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  }
  .card-cover {
    width: 100%; aspect-ratio: 16/9;
    background: linear-gradient(135deg, #1a1a2e, #0d0d1a);
    object-fit: cover; display: block;
  }
  .card-body { padding: 16px 18px 20px; }
  .card-title {
    font-size: 17px; font-weight: 700;
    margin-bottom: 6px; line-height: 1.3;
  }
  .card-desc {
    color: rgba(255,255,255,0.4); font-size: 13px;
    margin-bottom: 12px;
  }
  .card-meta {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 10px;
  }
  .card-prizes {
    display: flex; gap: 6px; flex-wrap: wrap;
  }
  .prize-tag {
    font-size: 11px; padding: 3px 10px;
    background: rgba(251,191,36,0.1);
    color: #fbbf24; border-radius: 20px;
    border: 1px solid rgba(251,191,36,0.15);
  }
  .card-bottom {
    display: flex; justify-content: space-between;
    align-items: center; margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.04);
  }
  .participants {
    font-size: 12px; color: rgba(255,255,255,0.4);
  }
  .countdown {
    font-size: 12px; color: #8be9fd;
    font-family: 'SF Mono', monospace;
    font-weight: 600;
  }
  .loading {
    text-align: center; padding: 60px 20px;
    color: rgba(255,255,255,0.3);
  }
  .empty {
    text-align: center; padding: 60px 20px;
    color: rgba(255,255,255,0.3);
  }
  @media (max-width: 640px) {
    .stats-bar { flex-wrap: wrap; gap: 12px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div id="app" class="container">
  <div class="header">
    <div class="logo">✦ LuckyDraw 广场</div>
    <div class="slogan">发现正在进行的所有公开抽奖</div>

    <div class="search-box">
      <input v-model="keyword" @keyup.enter="load" placeholder="搜索奖品、频道名...">
      <button @click="load">搜索</button>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat-item">
      <div class="stat-value">{{ stats.total }}</div>
      <div class="stat-label">活动总数</div>
    </div>
    <div class="stat-item">
      <div class="stat-value">{{ stats.ongoing }}</div>
      <div class="stat-label">进行中</div>
    </div>
    <div class="stat-item">
      <div class="stat-value">{{ stats.participants }}</div>
      <div class="stat-label">累计参与</div>
    </div>
    <div class="stat-item">
      <div class="stat-value">{{ stats.today }}</div>
      <div class="stat-label">今日新增</div>
    </div>
  </div>

  <div v-if="loading" class="loading">⏳ 加载中...</div>

  <div v-else-if="lotteries.length === 0" class="empty">
    <p>暂无进行中的公开抽奖</p>
    <p style="margin-top:8px; font-size:13px;">
      想让你的抽奖出现在这里？
      <a href="/create" style="color:#8b5cf6;">立即创建</a>
    </p>
  </div>

  <div v-else class="grid">
    <a v-for="lot in lotteries" :key="lot.id"
       :href="lot.bot_link" target="_blank" class="card">
      <img v-if="lot.cover_image" :src="lot.cover_image" class="card-cover"
           @error="$event.target.style.display='none'">
      <div v-else class="card-cover"></div>
      <div class="card-body">
        <div class="card-title">{{ lot.title }}</div>
        <div class="card-desc">{{ lot.subtitle || '点击参与' }}</div>

        <div class="card-prizes">
          <span v-for="p in lot.prizes" :key="p.name" class="prize-tag">
            {{ p.name }} ×{{ p.count }}
          </span>
        </div>

        <div class="card-bottom">
          <div class="participants">👥 {{ lot.participants }} 人</div>
          <div class="countdown">⏳ {{ lot.countdown }}</div>
        </div>
      </div>
    </a>
  </div>
</div>

<script>
const { createApp, ref, onMounted } = Vue;
createApp({
  setup() {
    const keyword = ref('');
    const lotteries = ref([]);
    const loading = ref(true);
    const stats = ref({ total: 0, ongoing: 0, participants: 0, today: 0 });

    const load = async () => {
      loading.value = true;
      try {
        const url = '/api/plaza' + (keyword.value ? '?q=' + encodeURIComponent(keyword.value) : '');
        const res = await fetch(url);
        const data = await res.json();
        lotteries.value = data.lotteries || [];
        stats.value = data.stats || stats.value;
      } catch (e) {
        console.error(e);
      } finally {
        loading.value = false;
      }
    };

    onMounted(load);
    return { keyword, lotteries, loading, stats, load };
  }
}).mount('#app');
</script>

</body>
</html>
